<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MentorMeet - Chatbox</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #121212;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Dark Mode Navbar */
        body.dark-mode .navbar {
            background: linear-gradient(to right, #333, #444, #555);
        }

        /* Mode Toggle Button */
        .mode-toggle button {
            background-color: transparent;
            border: none;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s;
        }

        body.dark-mode .mode-toggle button {
            color: #f1f1f1;
        }

        /* Top Bar */
        .top-bar {
            background-color: #0f2027;
            color: white;
            padding: 10px 20px;
            text-align: right;
            font-size: 14px;
        }

        /* Navbar Styling */
        .navbar .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-left: 80px;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            padding: 0;
            margin: 0;
        }

        .navbar ul li {
            margin: 0 15px;
        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 16px;
            padding: 8px 12px;
            transition: 0.3s;
        }

        .navbar ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        /* Chat Container */
        .chat-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* Chat Box */
        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
        }

        .mentor {
            background-color: #4a90e2;
            color: white;
            align-self: flex-start;
        }

        .mentee {
            background-color: #ffb347;
            color: white;
            align-self: flex-end;
        }

        .chat-input {
            display: flex;
            margin-top: 10px;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .chat-input button {
            padding: 12px 18px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .chat-input button:hover {
            background: #357abd;
        }

        /* Quote Section */
        .quote-section {
            background-color: #1b3a5f;
            padding: 40px 20px;
            text-align: center;
            font-size: 24px;
            color: #fff;
            font-style: italic;
            border-radius: 8px;
            margin-top: 50px;
        }

        .quote-author {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ffb347;
        }

        /* Footer */
        .footer {
            background-color: #0f2027;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 0;
        }

        /* Media Queries */
        @media (max-width: 768px) {
            .navbar ul {
                flex-direction: column;
                align-items: center;
            }

            .chat-container {
                padding: 15px;
            }

            .quote-section {
                font-size: 18px;
                padding: 30px 15px;
            }
        }

        @media (max-width: 480px) {
            .chat-container {
                padding: 10px;
            }

            .quote-section {
                font-size: 16px;
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        📧 Contact us: <a href="mailto:support@nedaca.com" style="color: #ff9e00;">support@nedaca.com</a> | 💡 Suggestions: <a href="https://forms.gle/Td57hPSbGPcBStge6" style="color: #ff9e00;">dropsuggestions</a>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">NEDACA</div>
        <ul>
            <li><a href="mentor-home.html">Home</a></li>
            <li><a href="mentor-menteelist.html">About Mentee</a></li>
            <li><a href="mentor-meeting.html">Mentor Meet</a></li>
            <li><a href="mentor-chatbox.html">Chatbox</a></li>
            <li><a href="mentor-task.html">Tasks</a></li>
        </ul>
        <div class="mode-toggle">
            <button id="modeButton" onclick="toggleMode()">🌙</button>
        </div>
    </nav>

    <div class="chat-container">
    <h2>Chatbox</h2>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
        <input type="text" id="chat-message" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

    <div class="quote-section">
        <p>"The best way to predict the future is to create it."</p>
        <div class="quote-author">— Peter Drucker</div>
    </div>

    <div class="footer">
        © 2025 NEDACA. All Rights Reserved.
    </div>

    <script>
        function toggleMode() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            
            // Change the button icon based on the mode
            const button = document.getElementById('modeButton');
            if (body.classList.contains('dark-mode')) {
                button.textContent = "🌞"; // Change to sun icon for light mode
            } else {
                button.textContent = "🌙"; // Change to moon icon for dark mode
            }
        }

    window.onload = function() {
            fetchMessages();
        };

        function fetchMessages() {
            fetch('/getMessages')
                .then(response => response.text())  // Expecting HTML as a response
                .then(messagesHTML => {
                    const chatBox = document.getElementById("chat-box");
                    chatBox.innerHTML = messagesHTML; // Insert the raw HTML into the chat box
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .catch(error => {
                    console.error("Error fetching messages:", error);
                });
        }

        function sendMessage() {
    const message = document.getElementById("chat-message").value;
    if (message.trim() === "") return;

    const chatBox = document.getElementById("chat-box");
    const newMessage = document.createElement("div");
    newMessage.classList.add("message", "mentor");
    newMessage.innerText = "You: " + message;

    chatBox.appendChild(newMessage);
    document.getElementById("chat-message").value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Prepare the CSV data (one message per line)
    const csvData = `"${message}","mentor"\n`;  // CSV format: "message","sender"

    fetch('/sendMessage', {
        method: 'POST',
        headers: {
            'Content-Type': 'text/csv'
        },
        body: csvData
    })
    .then(response => {
        if (response.ok) {
            fetchMessages(); // Refresh messages after sending
        } else {
            console.error('Failed to send message');
        }
    })
    .catch(error => console.error("Error sending message:", error));
}

    </script>
</body>
</html>
